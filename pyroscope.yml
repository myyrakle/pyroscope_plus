target: all
architecture_storage: v2

limits:
  # The default max_query_length is 24h, which makes the Grafana "Last 7d"
  # (and anything above 24h) fail with 400 "the query time range exceeds
  # the limit". max_query_lookback (default 7d) still bounds how far back
  # queries can reach.
  max_query_length: 30d

storage:
  backend: clickhouse
  clickhouse:
    addresses: clickhouse:9000
    database: ${CLICKHOUSE_DATABASE}
    objects_table: pyroscope_objects
    chunks_table: pyroscope_object_chunks
    username: ${CLICKHOUSE_USER}
    password: ${CLICKHOUSE_PASSWORD}
    secure: false
    # Long-range queries fan out into many concurrent chunk reads; the
    # default pool of 16 connections exhausts and reads fail with
    # "clickhouse: acquire conn timeout".
    max_open_connections: 64
    max_idle_connections: 32
    # Pool-acquire waits are bounded by dial_timeout: at the 5s default a
    # saturated pool fails reads instead of queueing them briefly.
    dial_timeout: 30s
    # 8 prefetched chunks pin 32MiB per open section reader; wide queries
    # open hundreds of sections concurrently and spike memory.
    read_prefetch_chunks: 4
    auto_create_tables: ${CLICKHOUSE_AUTO_CREATE_TABLES}
    cleanup:
      # Must stay enabled on exactly one process: v2 compaction constantly
      # rewrites blocks and tombstones the sources, so with cleanup off the
      # chunks table grows without bound (~88% garbage observed in prod).
      enabled: ${CLICKHOUSE_CLEANUP_ENABLED}
      # One pass per hour issues at most one lightweight-delete mutation per
      # table. Frequent small passes (minutes apart) flooded the part set:
      # every mutation re-versions all parts, and expired-part reclamation
      # could not keep up. 20k generations/pass comfortably outruns the
      # compaction churn (~40k generations/day).
      interval: 1h
      grace: 24h
      mutation_batch_size: 20000

metastore:
  raft:
    dir: /data-metastore/raft
    snapshots_dir: /data-metastore/raft
  data_dir: /data-metastore/data
