name: pyroscope-clickhouse

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.3@sha256:b627d7a9bc0e0c1bac26cdbe9d2fc6316faa29c5d8a174f28f5abd57d0fa6ba2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-19000}:9000"
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-18123}:8123"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-pyroscope}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-pyroscope}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          clickhouse-client
          --user "$$CLICKHOUSE_USER"
          --password "$$CLICKHOUSE_PASSWORD"
          --query "SELECT 1"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  pyroscope:
    image: ${PYROSCOPE_IMAGE:?Set PYROSCOPE_IMAGE to the built Pyroscope image}
    restart: unless-stopped
    init: true
    command:
      - -config.file=/etc/pyroscope/config.yaml
      - -config.expand-env=true
    ports:
      - "127.0.0.1:${PYROSCOPE_HTTP_PORT:-4040}:4040"
    environment:
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-pyroscope}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-pyroscope}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_AUTO_CREATE_TABLES: ${CLICKHOUSE_AUTO_CREATE_TABLES:-true}
      CLICKHOUSE_CLEANUP_ENABLED: ${CLICKHOUSE_CLEANUP_ENABLED:-false}
    volumes:
      - ./pyroscope.standalone.yaml:/etc/pyroscope/config.yaml:ro
      - pyroscope-metastore-data:/data-metastore
    tmpfs:
      - /data
      - /data-compactor
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/bin/profilecli", "ready", "--url=http://localhost:4040"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    stop_grace_period: 2m

volumes:
  clickhouse-data:
  pyroscope-metastore-data:
