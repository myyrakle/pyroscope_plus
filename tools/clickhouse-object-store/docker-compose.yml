name: clickhouse-object-store

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.3@sha256:b627d7a9bc0e0c1bac26cdbe9d2fc6316faa29c5d8a174f28f5abd57d0fa6ba2
    ports:
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-19000}:9000"
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-18123}:8123"
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  pyroscope:
    build:
      context: ../..
      dockerfile: tools/clickhouse-object-store/Dockerfile.pyroscope
    ports:
      - "127.0.0.1:${PYROSCOPE_HTTP_PORT:-4040}:4040"
    volumes:
      - pyroscope-data:/data
      - pyroscope-compactor-data:/data-compactor
      - pyroscope-metastore-data:/data-metastore
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/bin/profilecli", "ready", "--url=http://localhost:4040"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 90s

  echo-server:
    build:
      context: ./echo-server
    ports:
      - "127.0.0.1:${ECHO_HTTP_PORT:-28080}:8080"
    environment:
      PYROSCOPE_SERVER_ADDRESS: http://pyroscope:4040
      PYROSCOPE_APPLICATION_NAME: clickhouse.echo.server
      LISTEN_ADDRESS: :8080
    depends_on:
      pyroscope:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 2s
      retries: 20
      start_period: 5s

volumes:
  clickhouse-data:
  pyroscope-data:
  pyroscope-compactor-data:
  pyroscope-metastore-data:
